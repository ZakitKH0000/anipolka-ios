name: AniPolka
options:
  bundleIdPrefix: com.zakitkh
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  AniPolka:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core/Sources/ShelfCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zakitkh.anipolka
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: АниПолка
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: АниПолка
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        CFBundleLocalizations: [ru, en]
    scheme:
      testTargets:
        - AniPolkaUITests
  AniPolkaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: AniPolka
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zakitkh.anipolka.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
