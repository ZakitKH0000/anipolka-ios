name: AniPolka
options:
  bundleIdPrefix: com.zakitkh
  # Russian is the app's own language; Siri phrases for Shortcuts are written in it.
  developmentLanguage: ru
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  AniPolka:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core/Sources/ShelfCore
      - path: Shared
    dependencies:
      - target: AniPolkaWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zakitkh.anipolka
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconLight AppIconDonghua"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        INFOPLIST_KEY_CFBundleDisplayName: АниПолка
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: АниПолка
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        CFBundleLocalizations: [ru, en]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.zakitkh.anipolka.releases]
        NSFaceIDUsageDescription: Face ID открывает вашу коллекцию, если включён замок в настройках.
        CFBundleURLTypes:
          - CFBundleURLName: com.zakitkh.anipolka
            CFBundleURLSchemes: [anipolka]
    entitlements:
      path: build/AniPolka.entitlements
      properties:
        com.apple.security.application-groups: [group.com.zakitkh.anipolka]
    scheme:
      testTargets:
        - AniPolkaUITests
  AniPolkaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zakitkh.anipolka.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
    info:
      path: build/WidgetInfo.plist
      properties:
        CFBundleDisplayName: АниПолка
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: build/AniPolkaWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.zakitkh.anipolka]
  AniPolkaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: AniPolka
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zakitkh.anipolka.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
